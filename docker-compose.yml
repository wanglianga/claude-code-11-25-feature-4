services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ccdev
      POSTGRES_PASSWORD: ccdev
      POSTGRES_DB: ccdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdev -d ccdev"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ccdev
      PGPASSWORD: ccdev
      PGDATABASE: ccdev
      ADDR: ":8080"
      DEMO_SEED: "1"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
